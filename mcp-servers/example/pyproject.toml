[project]
name = "mcp-example"
version = "0.1.0"
description = "Example MCP server (template for new servers)"
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.3,<3", "mcp-common"]

[project.scripts]
mcp-example = "mcp_example.server:main"

[tool.uv.sources]
mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_example"]
